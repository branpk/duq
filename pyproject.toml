[project]
name = "duqlang"
version = "0.1.1"
description = "Data-processing language and CLI"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "bs4>=0.0.2",
    "httpx>=0.28.1",
    "prompt-toolkit>=3.0.53",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
]

[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "duq"
